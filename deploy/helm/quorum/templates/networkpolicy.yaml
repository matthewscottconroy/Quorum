{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quorum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "quorum.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: {{ .Values.config.port | int }}
          protocol: TCP

  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.postgresqlPodSelector | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    {{- if .Values.networkPolicy.smtpEnabled }}
    # SMTP
    - ports:
        - port: {{ .Values.config.smtpPort | int }}
          protocol: TCP
    {{- end }}
    # HTTPS (Stripe/PayPal webhook verification, cert fetching).
    # Intentionally broad: Stripe/PayPal publish no stable CIDRs, so this
    # cannot be narrowed with ipBlock. Use an egress proxy to tighten it.
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
