{{- if not .Values.secrets.existingSecret }}
{{- if or (not .Values.secrets.jwtSecret) (contains "CHANGEME" .Values.secrets.jwtSecret) }}
{{- fail "secrets.jwtSecret is empty or still a CHANGEME placeholder. Set a real value (openssl rand -hex 32) or point secrets.existingSecret at a pre-created Secret (Sealed Secrets / ESO)." }}
{{- end }}
{{- if contains "CHANGEME" .Values.secrets.databaseUrl }}
{{- fail "secrets.databaseUrl still contains a CHANGEME placeholder. Set the real DSN or point secrets.existingSecret at a pre-created Secret (Sealed Secrets / ESO)." }}
{{- end }}
# Created only when existingSecret is not set.
# In production use existingSecret with Sealed Secrets or ESO instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quorum.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quorum.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # prevent accidental deletion on upgrade
type: Opaque
stringData:
  QUORUM_DATABASE_URL:           {{ .Values.secrets.databaseUrl | quote }}
  QUORUM_JWT_SECRET:             {{ .Values.secrets.jwtSecret | quote }}
  QUORUM_SMTP_PASS:              {{ .Values.secrets.smtpPass | quote }}
  QUORUM_STRIPE_WEBHOOK_SECRET:  {{ .Values.secrets.stripeWebhookSecret | quote }}
  QUORUM_PAYPAL_WEBHOOK_ID:      {{ .Values.secrets.paypalWebhookId | quote }}
{{- end }}
