apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quorum

# References the flat k8s manifests checked into the source repository.
# Overlays patch this base for each environment.
resources:
  - ../../k8s/namespace.yaml
  - ../../k8s/configmap.yaml
  - ../../k8s/deployment.yaml
  - ../../k8s/service.yaml
  - ../../k8s/ingress.yaml
  - ../../k8s/networkpolicy.yaml
  # secret.yaml is excluded — manage quorum-secrets via Sealed Secrets or
  # External Secrets Operator and apply it out-of-band.

commonLabels:
  app.kubernetes.io/name: quorum
  app.kubernetes.io/part-of: quorum
