apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quorum-staging

bases:
  - ../../base

images:
  - name: registry.example.com/quorum
    newTag: latest

patches:
  - path: patches/configmap.yaml
  - path: patches/resources.yaml

# Override namespace for all resources in the staging overlay.
namespace: quorum-staging

commonLabels:
  app.kubernetes.io/managed-by: argocd
  environment: staging
