# Template — do NOT commit real values. Populate via your secrets manager
# (e.g. Sealed Secrets, External Secrets Operator, or Vault Agent Injector).
#
# WARNING: the CHANGEME values below are placeholders and will NOT work.
# The application refuses to start with a CHANGEME (or otherwise invalid)
# JWT secret — deploying this file as-is produces CrashLoopBackOff, not a
# running app with a guessable secret. Replace every CHANGEME before applying.
#
# Generate values:
#   QUORUM_JWT_SECRET:    openssl rand -hex 32
#   QUORUM_DATABASE_URL:  postgres://quorum:<password>@postgres.quorum.svc:5432/quorum?sslmode=require
apiVersion: v1
kind: Secret
metadata:
  name: quorum-secrets
  namespace: quorum
type: Opaque
stringData:
  QUORUM_DATABASE_URL: "postgres://quorum:CHANGEME@postgres.quorum.svc:5432/quorum?sslmode=require"
  QUORUM_JWT_SECRET: "CHANGEME-generate-with-openssl-rand-hex-32-minimum-32-chars"
  QUORUM_SMTP_PASS: ""
  QUORUM_STRIPE_WEBHOOK_SECRET: ""
  QUORUM_PAYPAL_WEBHOOK_ID: ""
