# Restrict quorum pod traffic:
#   Ingress: only from the ingress controller
#   Egress:  DNS + PostgreSQL only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quorum
  namespace: quorum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quorum
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP

  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL — adjust selector to match your DB pod labels
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # SMTP (outbound email) — disabled by default, mirroring the Helm chart's
    # networkPolicy.smtpEnabled: false. Uncomment when QUORUM_SMTP_HOST is
    # configured and outbound email is actually in use.
    # - ports:
    #     - port: 587
    #       protocol: TCP
    # HTTPS — intentionally broad (any destination on 443): Stripe and PayPal
    # publish no stable CIDRs for their API/webhook-verification endpoints, so
    # this cannot be narrowed with ipBlock. To tighten it, route outbound
    # HTTPS through an egress proxy and restrict this rule to the proxy.
    - ports:
        - port: 443
          protocol: TCP
