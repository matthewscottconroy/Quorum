apiVersion: apps/v1
kind: Deployment
metadata:
  name: quorum
  namespace: quorum
  labels:
    app.kubernetes.io/name: quorum
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quorum
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quorum
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: quorum
          # Image tag is updated by the Tekton pipeline on each successful build.
          image: registry.example.com/quorum:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: quorum-config
            - secretRef:
                name: quorum-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 2

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        # readOnlyRootFilesystem requires a writable /tmp for the Go runtime.
        - name: tmp
          emptyDir: {}

      imagePullSecrets:
        - name: registry-credentials
